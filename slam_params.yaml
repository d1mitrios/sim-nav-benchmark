# slam_toolbox (online_async) — Phase 3, Benchmark Factory
# Wall-clock compatible with the Isaac publishers (use_sim_time: false).
# Arena 20x20 m, doors 0.5-0.95 m -> resolution 0.05.
slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    resolution: 0.05
    max_laser_range: 12.0          # the scan reports RMAX=100 on misses — clipped here
    minimum_time_interval: 0.2
    transform_publish_period: 0.05
    transform_timeout: 0.5
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 20
    do_loop_closing: true
    map_update_interval: 2.0
    debug_logging: false
